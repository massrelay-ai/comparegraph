name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, exe: comparegraph }
          - { platform: darwin-arm64, os: macos-14, exe: comparegraph }
          - { platform: darwin-x64, os: macos-13, exe: comparegraph }
          - { platform: win32-x64, os: windows-latest, exe: comparegraph.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.platform }}
      - name: Package (builds on this host, stamps the version)
        shell: bash
        run: scripts/package-npm.sh "${GITHUB_REF_NAME#v}" ${{ matrix.platform }}
      - name: Stage release asset and checksum
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ matrix.exe }}" = "comparegraph.exe" ] && ext=".exe"
          out="comparegraph-${{ matrix.platform }}$ext"
          cp "packages/platforms/${{ matrix.platform }}/bin/${{ matrix.exe }}" "dist/$out"
          (cd dist && (sha256sum "$out" 2>/dev/null || shasum -a 256 "$out") > "$out.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.platform }}
          path: packages/platforms/${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat comparegraph-*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm # configure required reviewers = manual approval
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without token
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set; nothing published." && echo "SKIP=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.SKIP != '1'
        with:
          pattern: pkg-*
          path: packages/platforms-dl
      - name: Verify versions and publish
        if: env.SKIP != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for p in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            cp -a "packages/platforms-dl/pkg-$p/." "packages/platforms/$p/"
            v=$(node -p "require('./packages/platforms/$p/package.json').version")
            [ "$v" = "$version" ] || { echo "platform $p version $v != tag $version"; exit 1; }
          done
          sv=$(node -p "require('./packages/comparegraph/package.json').version")
          [ "$sv" = "$version" ] || { echo "shell version $sv != tag $version"; exit 1; }
          # platform packages first, then the shell
          for d in packages/platforms/*/ packages/comparegraph/; do
            (cd "$d" && npm publish --provenance --access public)
          done
