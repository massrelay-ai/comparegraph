name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, exe: comparegraph }
          - { platform: darwin-arm64, os: macos-14, exe: comparegraph }
          - { platform: darwin-x64, os: macos-13, exe: comparegraph }
          - { platform: win32-x64, os: windows-latest, exe: comparegraph.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.platform }}
      - run: cargo build --release -p comparegraph
      - name: Strip
        if: runner.os != 'Windows'
        run: strip target/release/${{ matrix.exe }}
      - name: Stage binary as comparegraph-<platform>
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ matrix.exe }}" = "comparegraph.exe" ] && ext=".exe"
          cp "target/release/${{ matrix.exe }}" "dist/comparegraph-${{ matrix.platform }}$ext"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum comparegraph-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm # configure required reviewers = manual approval
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without token
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set; nothing published." && echo "SKIP=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.SKIP != '1'
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Package and publish
        if: env.SKIP != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for p in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            bash scripts/package-npm.sh "$version" "$p"
          done
          # platform packages first, then the shell
          for d in packages/comparegraph-*/ packages/comparegraph/; do
            [ -f "$d/package.json" ] || continue
            (cd "$d" && npm publish --provenance --access public)
          done
