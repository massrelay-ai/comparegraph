name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, exe: comparegraph }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, exe: comparegraph }
          - { platform: darwin-arm64, os: macos-15, exe: comparegraph }
          - { platform: darwin-x64, os: macos-15-intel, exe: comparegraph }
          - { platform: win32-x64, os: windows-latest, exe: comparegraph.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.platform }}
      - name: The tag must equal the Cargo.toml version (bump it in the tagged commit; exit 4)
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="comparegraph") | .version')
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "Cargo.toml $v != tag ${GITHUB_REF_NAME#v}"; exit 4; }
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p comparegraph
      - name: Build (Windows with clang-cl; a grammar's C build passes a GCC warning flag that cl rejects)
        if: runner.os == 'Windows'
        env:
          CC: clang-cl
          CXX: clang-cl
        run: cargo build --release --locked -p comparegraph
      - name: Stage the release asset and its checksum
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ matrix.exe }}" = "comparegraph.exe" ] && ext=".exe"
          out="comparegraph-${{ matrix.platform }}$ext"
          cp "target/release/${{ matrix.exe }}" "dist/$out"
          case "${{ matrix.platform }}" in linux-*) strip "dist/$out" ;; esac
          (cd dist && (sha256sum "$out" 2>/dev/null || shasum -a 256 "$out") > "$out.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat comparegraph-*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  publish-npm:
    # Set the repository variable NPM_PUBLISH=true once trusted publishing is configured on npmjs.com (docs/dev/release.md).
    if: vars.NPM_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing authenticates this workflow through GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (needs 11.5.1 or later)
        run: npm install -g npm@latest
      - name: npm/package.json version must equal the tag (bump it in the tagged commit; exit 4)
        run: |
          v=$(jq -r .version npm/package.json)
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "npm/package.json $v != tag ${GITHUB_REF_NAME#v}"; exit 4; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bins
          pattern: bin-*
          merge-multiple: true
      - name: The binaries are the released ones (same artifacts, checksums verified)
        working-directory: bins
        run: |
          cat comparegraph-*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Build the six packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}" --bins bins --out dist-npm
      - name: Publish the platform packages, then the wrapper
        # NPM_TOKEN (a granular token, 90 days) authenticates while it is set; when the secret is empty npm falls back to
        # trusted publishing through OIDC, once the maintainer has registered this workflow on each package (docs/dev/release.md).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist-npm/comparegraph-*; do
            (cd "$dir" && npm publish --access public --provenance)
          done
          (cd dist-npm/comparegraph && npm publish --access public --provenance)

  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry authenticates this repository's owner through GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mcp-publisher (pinned, checksum verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSLo "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher && chmod +x mcp-publisher
      - name: server.json version must equal the tag (bump it in the tagged commit; exit 4)
        run: |
          v=$(jq -r .version server.json)
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "server.json $v != tag ${GITHUB_REF_NAME#v}"; exit 4; }
      - name: Validate, authenticate, publish
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
