name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test -p comparegraph
      - name: Clippy
        run: cargo clippy -p comparegraph --tests -- -D warnings
      - name: Conformance
        run: cargo run -q -p comparegraph -- conform reference --fixtures fixtures
      - name: Catalog check
        if: hashFiles('docs/catalog.json') != ''
        run: cargo run -q -p comparegraph -- catalog --check
      - name: install script test (good sum installs, bad sum refuses)
        run: node --test scripts/test/install-script.test.mjs
      - name: server.json version equals Cargo.toml
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="comparegraph") | .version')
          [ "$(jq -r .version server.json)" = "$v" ] || { echo "server.json != Cargo.toml $v"; exit 1; }
