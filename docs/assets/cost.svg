<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" width="1050" role="img" aria-labelledby="t d">
<title id="t">Size of the source against the size of the ranked candidates</title><desc id="d">Six projects hold 106.1 MB of source, about 26.5 M tokens. The comparegraph map answers for 30 features on all six total 336 KB, about 84 k tokens, and the matrix is 6 KB. Candidates are places to read, not verdicts.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2328">
<rect x="40" y="75" width="150" height="140" rx="4" fill="#ddf4ff" stroke="#57606a" stroke-width="1.2"/>
<text x="40" y="33" font-size="13" font-weight="700" text-anchor="start">Source of six projects</text>
<text x="40" y="53" font-size="18" font-weight="700" text-anchor="start">106.1 MB</text>
<text x="40" y="71" font-size="12" text-anchor="start" fill="#57606a">≈ 26.5 M tokens (estimate)</text>
<line x1="215" y1="170" x2="425" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="320" y="156" font-size="13" text-anchor="middle" font-family="monospace" fill="#0550ae">comparegraph map</text>
<text x="320" y="190" font-size="12" text-anchor="middle">30 features × 6 projects</text>
<rect x="450" y="145" width="150" height="70" rx="4" fill="#fff8c5" stroke="#57606a" stroke-width="1.2"/>
<text x="450" y="103" font-size="13" font-weight="700" text-anchor="start">Ranked candidates, all six</text>
<text x="450" y="123" font-size="18" font-weight="700" text-anchor="start">336 KB</text>
<text x="450" y="141" font-size="12" text-anchor="start" fill="#57606a">≈ 84 k tokens</text>
<rect x="660" y="194" width="90" height="21" rx="4" fill="#fff8c5" stroke="#57606a" stroke-width="1.2"/>
<text x="660" y="152" font-size="13" font-weight="700" text-anchor="start">Matrix, 30 × 6</text>
<text x="660" y="172" font-size="18" font-weight="700" text-anchor="start">6 KB</text>
<text x="660" y="190" font-size="12" text-anchor="start" fill="#57606a">≈ 1 k tokens</text>
<line x1="30" y1="215" x2="780" y2="215" stroke="#57606a" stroke-width="1.2"/>
<text x="780" y="230" font-size="11" text-anchor="end" fill="#57606a">bars: log scale</text>
<text x="800" y="70" font-size="13" font-weight="700">What this shows</text>
<text x="800" y="92" font-size="12">What an agent reads to start,</text>
<text x="800" y="108" font-size="12">316 times smaller than the source.</text>
<text x="800" y="132" font-size="12">What it keeps is a matrix</text>
<text x="800" y="148" font-size="12">whose cells cite lines.</text>
<text x="525" y="268" font-size="12" text-anchor="middle">Candidates are places to read, not verdicts (held-out recall@5 0.149).</text>
<text x="525" y="286" font-size="12" text-anchor="middle">Every matrix cell cites a line that <tspan font-family="monospace" fill="#0550ae">check</tspan> re-verifies.</text>
</g>
</svg>
