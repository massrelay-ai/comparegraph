[package]
name = "comparegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-repo code mapping: many clones, one taxonomy, evidence on every cell"

[[bin]]
name = "comparegraph"
path = "src/main.rs"

[lib]
name = "comparegraph"
path = "src/lib.rs"

[build-dependencies]
sha2 = "0.10"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
ignore = "0.4"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
tree-sitter-php = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.6"
tree-sitter-containerfile = "0.9"
# 0.1.x is yanked upstream; resolves only through the committed Cargo.lock — never run cargo update blindly
tree-sitter-perl-next = "0.1"
tree-sitter-objc = "3"
tree-sitter-scss = "1"
tree-sitter-sql = { package = "tree-sitter-sequel", version = "0.3" }
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-r = "1.2"
tree-sitter-graphql = "0.2"
tree-sitter-scala = "0.26"
tree-sitter-powershell = "0.26"
libc = "0.2.186"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
